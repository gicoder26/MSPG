// Belt result mapping by score
function getBeltFromScore(total) {
  if (total <= 3) return "white";
  if (total <= 6) return "yellow";
  if (total <= 9) return "orange";
  if (total <= 12) return "green";
  if (total <= 15) return "blue";
  if (total <= 18) return "brown";
  return "black";
}

function Test({ navigate }) {
  const [step, setStep] = useState(0); // 0 = intro, 1-7 = questions, 8 = result
  const [answers, setAnswers] = useState({});
  const [result, setResult] = useState(null);

  useEffect(() => { trackEvent("page_view", { section: "test" }); }, []);

  function startTest() {
    setStep(1);
    trackEvent("belt_test_started");
  }

  function answer(score) {
    const newAnswers = { ...answers, [step]: score };
    setAnswers(newAnswers);
    if (step === TEST_QUESTIONS.length) {
      const total = Object.values(newAnswers).reduce((a, b) => a + b, 0);
      const beltId = getBeltFromScore(total);
      const belt = BELTS.find(b => b.id === beltId);
      const book = BOOKS.find(b => b.id === beltId);
      setResult({ belt, book, total });
      setStep(8);
      trackEvent("belt_test_completed", { test_result: beltId, total_score: total });
      trackEvent("belt_result_viewed", { test_result: beltId });
    } else {
      setStep(step + 1);
    }
  }

  function restart() {
    setStep(0); setAnswers({}); setResult(null);
  }

  const q = TEST_QUESTIONS[step - 1];
  const progress = step <= TEST_QUESTIONS.length ? (step - 1) / TEST_QUESTIONS.length * 100 : 100;

  return (
    <section style={{ padding: "80px 20px", minHeight: "80vh", display: "flex", alignItems: "center" }}>
      <div style={{ maxWidth: 640, margin: "0 auto", width: "100%" }}>
        {/* INTRO */}

              style={{ background: "#1a1a2e", color: "#f5c842", border: "none", borderRadius: 12, padding: "18px 48px", fontSize: 17, fontWeight: 600, cursor: "pointer" }}>
              Empezar el test →
            </button>
          </div>

        {/* QUESTIONS */}
        {step >= 1 && step <= TEST_QUESTIONS.length && q && (

              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8, fontSize: 13, color: "#9898a8" }}>

                <div className="progress-fill" style={{ width: progress + "%", background: "#f5c842" }} />
              </div>
            </div>

              {q.question}

function SampleReader({ bookId, navigate }) {
  const book = BOOKS.find(b => b.id === bookId) || BOOKS[0];
  const [page, setPage] = useState(0);
  const pages = book.samplePages;
  const currentPage = pages[page];
  const isLast = page === pages.length - 1;

  useEffect(() => {
    trackEvent("sample_started", { book_id: book.id, book_title: book.title, belt_level: book.beltId });
    window.scrollTo(0, 0);
  }, [bookId]);

  function nextPage() {
    if (!isLast) {
      const newPage = page + 1;
      setPage(newPage);
      trackEvent("sample_page_viewed", { book_id: book.id, book_title: book.title, belt_level: book.beltId, page_number: newPage + 1 });
      if (newPage === pages.length - 1) {
        trackEvent("sample_completed", { book_id: book.id, book_title: book.title, belt_level: book.beltId });
      }
    }
  }

  return (
    <section style={{ padding: "80px 20px", minHeight: "80vh" }}>
      <div style={{ maxWidth: 680, margin: "0 auto" }}>
        <button onClick={() => navigate("book", book.id)}
          style={{ background: "none", border: "none", color: "#7b7b8b", fontSize: 14, cursor: "pointer", marginBottom: 24, display: "flex", alignItems: "center", gap: 6 }}>
          ← Volver al libro
        </button>
        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, flexWrap: "wrap", gap: 12 }}>
          <div>
            <div style={{ fontSize: 13, color: "#9898a8" }}>Muestra gratuita</div>
            <div style={{ fontSize: 18, fontWeight: 600, color: "#1a1a2e", fontFamily: "'Cormorant Garamond', serif" }}>{book.title}</div>
          </div>
          <div style={{ fontSize: 13, color: "#9898a8" }}>Página {page + 1} de {pages.length}</div>
        </div>
        {/* Progress */}
        <div className="progress-bar" style={{ marginBottom: 24 }}>
          <div className="progress-fill" style={{ width: ((page + 1) / pages.length * 100) + "%", background: book.beltColor }} />
        </div>
        {/* Page */}
        <div className="sample-page" style={{ minHeight: isLast ? 300 : 400 }}>
          <div className="watermark"><span>Muestra Gratuita</span></div>
          {isLast ? (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", flex: 1, textAlign: "center", gap: 20, position: "relative", zIndex: 1 }}>
              <div style={{ fontSize: 40 }}>🎸</div>
              <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 26, fontWeight: 600, color: "#1a1a2e", margin: 0 }}>

              <p style={{ fontSize: 16, color: "#6b6b7b", lineHeight: 1.7, maxWidth: 420, margin: 0 }}>
                Accede al libro completo desde Patreon y continúa tu aprendizaje con {book.includes[0]}.
              </p>
              <button onClick={() => goToPatreon(book.id, book.title, book.beltId, "sample_final_page")}
                style={{ background: "#1a1a2e", color: "#f5c842", border: "none", borderRadius: 12, padding: "16px 40px", fontSize: 16, fontWeight: 600, cursor: "pointer", marginTop: 8 }}>
                Continuar en Patreon →
              </button>
              <p style={{ fontSize: 12, color: "#b0b0c0", margin: 0 }}>
                🔒 Compra segura. Esta app no procesa pagos.
              </p>
            </div>
          ) : (
            <div style={{ position: "relative", zIndex: 1 }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: "#9898a8", textTransform: "uppercase", letterSpacing: 1, marginBottom: 16 }}>
                {currentPage.type === "exercise" ? "Ejercicio" : currentPage.type === "theory" ? "Teoría" : "Introducción"}
              </div>
              <h3 style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 24, fontWeight: 600, color: "#1a1a2e", margin: "0 0 20px" }}>
                {currentPage.title}

                {currentPage.content}
              </div>
            </div>
          )}
        </div>
        {/* Navigation */}
        {!isLast && (
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 20, gap: 12 }}>
            <button onClick={() => setPage(Math.max(0, page - 1))} disabled={page === 0}
              style={{ background: "white", border: "1px solid #e8e6df", borderRadius: 10, padding: "12px 24px", fontSize: 14, cursor: page === 0 ? "default" : "pointer", color: page === 0 ? "#c0c0d0" : "#1a1a2e" }}>
              ← Anterior
            </button>
            <button onClick={nextPage}
              style={{ background: book.beltColor, color: book.beltTextColor, border: "none", borderRadius: 10, padding: "12px 28px", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
              Siguiente →

          </div>
        )}
      </div>
    </section>
  );
}

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))", gap: 40, marginBottom: 48 }}>
          <div>
            <div style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 22, fontWeight: 600, color: "#faf8f4", marginBottom: 12 }}>Cinturones de Guitarra</div>
            <p style={{ fontSize: 14, color: "#6b6b7b", lineHeight: 1.7, margin: 0 }}>Un método progresivo para aprender guitarra paso a paso.</p>
          </div>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: "#5b5b7b", textTransform: "uppercase", letterSpacing: 1, marginBottom: 16 }}>El método</div>
            {["home", "method", "test", "books"].map(s => (
              <button key={s} onClick={() => navigate(s)}
                style={{ display: "block", background: "none", border: "none", color: "#7b7b9b", fontSize: 14, cursor: "pointer", marginBottom: 10, padding: 0, textAlign: "left" }}>
                {s === "home" ? "Inicio" : s === "method" ? "Mapa del método" : s === "test" ? "Test de cinturón" : "Libros"}
              </button>
            ))}
          </div>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color: "#5b5b7b", textTransform: "uppercase", letterSpacing: 1, marginBottom: 16 }}>Acceder</div>
            <button onClick={() => { trackEvent("patreon_click", { source_section: "footer" }); window.open(PATREON_URL, "_blank", "noopener"); }}
              style={{ background: "#f5c842", color: "#1a1a2e", border: "none", borderRadius: 10, padding: "12px 24px", fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
              Ir a Patreon →
            </button>
            <p style={{ fontSize: 12, color: "#5b5b7b", marginTop: 12, lineHeight: 1.6 }}>🔒 Compra segura. No procesamos pagos.</p>
          </div>
        </div>
        <div style={{ borderTop: "1px solid #252540", paddingTop: 24, display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
          <span style={{ fontSize: 13, color: "#5b5b7b" }}>© {new Date().getFullYear()} Cinturones de Guitarra</span>
          <button onClick={() => navigate("metrics")} style={{ background: "none", border: "none", color: "#35355a", fontSize: 12, cursor: "pointer" }}>
            📊 Demo métricas
          </button>
        </div>
      </div>
    </footer>
  );
}

/* ============================================================
   APP ROUTER
   ============================================================ */
function App() {
  const [view, setView] = useState({ section: "home", param: null });

  function navigate(section, param = null) {
    setView({ section, param });
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  const { section, param } = view;
  return (
    <div style={{ paddingTop: 64 }}>
      <Nav currentSection={section} navigate={navigate} />
      {section === "home"    && <Home navigate={navigate} />}
      {section === "method"  && <Method navigate={navigate} />}
      {section === "test"    && <Test navigate={navigate} />}
      {section === "books"   && <Books navigate={navigate} />}
      {section === "book"    && <BookDetail bookId={param} navigate={navigate} />}
      {section === "sample"  && <SampleReader bookId={param} navigate={navigate} />}
      {section === "author"  && <Author navigate={navigate} />}
      {section === "metrics" && <Metrics />}
      <Footer navigate={navigate} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

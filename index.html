<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>GuitarBelts</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0d0d14;
  --surface:#161622;
  --surface2:#1e1e2e;
  --border:#2a2a3e;
  --text:#f0f0f8;
  --muted:#7070a0;
  --accent:#f5c842;
  --accent2:#f07d2a;
  --green:#3ecf8e;
  --blue:#5b8dee;
  --red:#f06060;

  --belt-white:#e8e8f0;
  --belt-yellow:#f5c842;
  --belt-orange:#f07d2a;
  --belt-green:#3ecf8e;
  --belt-blue:#5b8dee;
  --belt-brown:#a0673a;
  --belt-black:#f0f0f8;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;}
button{font-family:'Outfit',sans-serif;cursor:pointer;border:none;background:none;color:inherit;}

/* APP SHELL */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:430px;margin:0 auto;position:relative;overflow:hidden;}

/* SCREENS */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform 0.35s cubic-bezier(0.4,0,0.2,1),opacity 0.35s ease;overflow:hidden;}
.screen.hidden{transform:translateX(100%);opacity:0;pointer-events:none;}
.screen.slide-left{transform:translateX(-100%);opacity:0;pointer-events:none;}

/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;flex-shrink:0;border-bottom:1px solid var(--border);}
.topbar-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;}
.back-btn{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;}

/* SCROLL AREA */
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:100px;}
.scroll::-webkit-scrollbar{display:none;}

/* BOTTOM NAV */
.bottom-nav{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:50;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:10px;font-weight:500;color:var(--muted);transition:color 0.2s;}
.nav-btn.active{color:var(--accent);}
.nav-icon{font-size:22px;line-height:1;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px;}
.card+.card{margin-top:12px;}

/* BELT PILL */
.belt-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;font-size:12px;font-weight:600;}
.belt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* PROGRESS RING */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-label{position:absolute;font-family:'Syne',sans-serif;font-weight:800;font-size:22px;}

/* CHORD DIAGRAM */
.chord-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface2);}
.fret-row{display:contents;}
.fret-cell{height:36px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;position:relative;}
.fret-cell:last-child{border-right:none;}
.fret-cell.nut{background:var(--surface);border-bottom:3px solid var(--text);}
.finger{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;position:absolute;}
.string-label{font-size:10px;color:var(--muted);font-weight:600;}
.open-mark{font-size:14px;color:var(--green);}
.muted-mark{font-size:14px;color:var(--red);}

/* PLAY BTN */
.play-btn{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#000;font-size:24px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.15s,opacity 0.15s;}
.play-btn:active{transform:scale(0.92);}
.play-btn.playing{background:var(--green);}

/* EXERCISE */
.exercise-bar{background:var(--surface2);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;margin-bottom:10px;}
.ex-num{width:32px;height:32px;border-radius:10px;background:var(--border);display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;flex-shrink:0;}
.ex-num.done{background:var(--green);color:#000;}

/* TABS */
.tab-row{display:flex;gap:8px;padding:4px;background:var(--surface2);border-radius:14px;margin-bottom:20px;}
.tab-btn{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);transition:all 0.2s;}
.tab-btn.active{background:var(--surface);color:var(--text);}

/* METRONOME */
.metro-beat{width:14px;height:14px;border-radius:50%;background:var(--border);transition:background 0.05s;}
.metro-beat.active{background:var(--accent);}

/* FRETBOARD */
.fretboard{background:var(--surface2);border-radius:16px;padding:16px;overflow-x:auto;}
.fretboard-inner{display:grid;min-width:320px;}
.fb-string{display:flex;align-items:center;height:36px;position:relative;}
.fb-line{flex:1;height:2px;background:var(--border);}
.fb-fret{width:52px;height:100%;border-left:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;cursor:pointer;}
.fb-fret.nut{border-left:4px solid var(--text);}
.fb-note{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;position:absolute;transition:all 0.2s;}
.fb-note.root{background:var(--accent2);}

/* LESSON STEP */
.step-indicator{display:flex;gap:6px;justify-content:center;padding:16px 0 8px;}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all 0.3s;}
.step-dot.active{background:var(--accent);width:20px;border-radius:4px;}
.step-dot.done{background:var(--green);}

/* ANIMATIONS */
@keyframes pop{0%{transform:scale(0.8);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:pop 0.3s ease both;}
.fade-in{animation:fadeIn 0.4s ease both;}

/* BIG ACCENT */
.big-accent{font-family:'Syne',sans-serif;font-size:clamp(36px,10vw,52px);font-weight:800;line-height:1.05;}
.sub-text{font-size:14px;color:var(--muted);line-height:1.6;}

/* SUCCESS FLASH */
.success-overlay{position:absolute;inset:0;background:rgba(62,207,142,0.15);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn 0.2s ease;pointer-events:none;}

/* TOGGLE */
.toggle{width:48px;height:26px;border-radius:13px;background:var(--border);position:relative;transition:background 0.2s;flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle-thumb{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left 0.2s;}
.toggle.on .toggle-thumb{left:25px;}

/* STREAK */
.streak-flame{font-size:28px;animation:pulse 2s ease infinite;}
</style>
</head>

/* =========================================================
   ROUTER
   ========================================================= */
let currentScreen = 'home';
let screenHistory = [];

function goTo(screen, param){
  if(screen === currentScreen) return;
  screenHistory.push(currentScreen);
  const curr = document.getElementById('screen-'+currentScreen);
  const next = document.getElementById('screen-'+screen);
  if(!next) return;
  curr.classList.add('slide-left');
  next.classList.remove('hidden');
  next.classList.remove('slide-left');
  currentScreen = screen;
  // render
  if(screen==='chords') renderChords();
  if(screen==='exercises') renderExercises();
  if(screen==='belts') renderBelts();
  if(screen==='profile') renderProfile();
  if(screen==='lesson') renderLesson(LESSONS[0], 0);
  if(screen==='exercise-detail' && param) renderExerciseDetail(param);
  // update nav
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const active = document.querySelector(`.nav-btn[onclick="goTo('${screen}')"]`);
  if(active) active.classList.add('active');
}

function goBack(){
  if(!screenHistory.length) return;
  const prev = screenHistory.pop();
  const curr = document.getElementById('screen-'+currentScreen);
  const prevEl = document.getElementById('screen-'+prev);
  curr.classList.add('hidden');
  curr.classList.remove('slide-left');
  prevEl.classList.remove('slide-left');
  prevEl.classList.remove('hidden');
  currentScreen = prev;
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const active = document.querySelector(`.nav-btn[onclick="goTo('${prev}')"]`);
  if(active) active.classList.add('active');
}

/* =========================================================
   AUDIO ENGINE
   ========================================================= */
let audioCtx = null;
function getAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; }

function playNote(freq, time, duration=0.6){
  if(!freq || freq<50) return;
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value = freq;
  osc.type = 'triangle';
  gain.gain.setValueAtTime(0,time);
  gain.gain.linearRampToValueAtTime(0.3,time+0.01);
  gain.gain.exponentialRampToValueAtTime(0.001,time+duration);
  osc.start(time); osc.stop(time+duration);
}

function playChord(freqs){
  const ctx = getAudio();
  const now = ctx.currentTime;
  freqs.forEach((f,i)=>{ if(f>0) playNote(f, now + i*0.04, 1.2); });
}

function playClick(time, accent=false){
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value = accent ? 1200 : 800;
  osc.type = 'square';
  gain.gain.setValueAtTime(0.4,time);
  gain.gain.exponentialRampToValueAtTime(0.001,time+0.05);
  osc.start(time); osc.stop(time+0.06);
}

      </div>

function renderChordDiagram(chord){
  // 6 strings, 4 frets
  const strings = ['e','B','G','D','A','E'];
  const fingerMap = {};
  chord.fingers.forEach(f=>{ fingerMap[f.string] = f; });

  // Top labels
  let top = '<div style="display:flex;gap:0;margin-bottom:4px;padding-left:0;">';
  for(let s=1;s<=6;s++){
    const f = fingerMap[s];
    top += `<div style="flex:1;text-align:center;font-size:16px;">`;
    if(f && f.muted) top += `<span class="muted-mark">✕</span>`;
    else if(f && f.open) top += `<span class="open-mark">○</span>`;
    else top += `<span style="font-size:11px;color:var(--muted);">${strings[s-1]}</span>`;
    top += '</div>';
  }
  top += '</div>';

  // Fret grid
  let grid = '<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--surface2);">';
  for(let fret=1;fret<=4;fret++){
    grid += `<div style="display:flex;border-bottom:${fret<4?'1px solid var(--border)':'none'};">`;
    for(let s=1;s<=6;s++){
      const f = fingerMap[s];
      const hasNote = f && f.fret===fret && !f.open && !f.muted;
      grid += `<div style="flex:1;height:40px;display:flex;align-items:center;justify-content:center;border-right:${s<6?'1px solid var(--border)':'none'};position:relative;${fret===1?'border-top:3px solid var(--border)':''}">`;
      if(hasNote) grid += `<div class="finger pop">${f.finger}</div>`;
      grid += '</div>';
    }
    grid += '</div>';
  }
  grid += '</div>';
  return top + grid;
}

function handlePlayChord(ci){
  const chords = CHORDS[currentChordBelt]||[];
  const chord = chords[ci];
  if(!chord) return;
  playChord(chord.frequencies);
  const btn = document.getElementById('play-'+ci);
  if(btn){ btn.classList.add('playing'); setTimeout(()=>btn.classList.remove('playing'),800); }
  STATE.xp += 2; save();
}

function formatTime(s){ return Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60; }

let exTimeLeft = 0;
function toggleExTimer(total){
  const btn = document.getElementById('ex-start-btn');
  const disp = document.getElementById('ex-timer-display');
  if(!exRunning){
    exRunning = true;
    exTimeLeft = exTimeLeft || total;
    btn.textContent = 'Pausar';
    btn.style.background = 'var(--muted)';
    exTimer = setInterval(()=>{
      exTimeLeft--;
      if(disp) disp.textContent = formatTime(exTimeLeft);
      if(exTimeLeft <= 0){
        clearInterval(exTimer); exTimer = null; exRunning = false;
        if(btn){ btn.textContent = 'Completado ✓'; btn.style.background = 'var(--green)'; btn.style.color = '#000'; }
      }
    }, 1000);
  } else {
    exRunning = false;
    clearInterval(exTimer); exTimer = null;
    if(btn){ btn.textContent = 'Continuar'; btn.style.background = 'var(--accent)'; btn.style.color = '#000'; }
  }
}

function markExDone(id){
  if(!STATE.exercisesDone.includes(id)){
    STATE.exercisesDone.push(id);
    STATE.xp += 30;
    STATE.streak = Math.max(STATE.streak, 1);
    save();
  }
  // Flash
  const overlay = document.createElement('div');
  overlay.className = 'success-overlay';
  overlay.innerHTML = '<div style="font-size:80px;animation:pop 0.4s ease;">⭐</div>';
  document.getElementById('screen-exercise-detail').appendChild(overlay);
  setTimeout(()=>{ overlay.remove(); goBack(); renderExercises(); renderHome(); }, 1200);
}

let metroBpm = 60;
function nextLessonStep(){
  if(metroInterval){ clearInterval(metroInterval); metroInterval = null; metroRunning = false; }
  if(lessonStep < currentLesson.steps.length - 1){
    renderLesson(currentLesson, lessonStep+1);
  }
}

function findChord(name){
  for(const belt in CHORDS){
    const c = CHORDS[belt].find(c=>c.name===name);
    if(c) return c;
  }
  return null;
}

function toggleMetro(bpm){
  if(metroRunning){
    clearInterval(metroInterval); metroInterval = null; metroRunning = false;
    const btn = document.getElementById('metro-btn');
    if(btn){ btn.textContent = '▶ Iniciar'; btn.style.background = 'var(--accent)'; }
    return;
  }
  metroRunning = true;
  const btn = document.getElementById('metro-btn');
  if(btn){ btn.textContent = '⏹ Parar'; btn.style.background = 'var(--red)'; }
  metroBeat = 0;
  const interval = 60000 / metroBpm;
  metroInterval = setInterval(()=>{
    const ctx = getAudio();
    playClick(ctx.currentTime, metroBeat===0);
    document.querySelectorAll('.metro-beat').forEach((el,i)=>{
      el.classList.toggle('active', i===metroBeat);
    });
    metroBeat = (metroBeat+1)%4;
  }, interval);
}

function changeBPM(delta){
  metroBpm = Math.max(40, Math.min(200, metroBpm + delta));
  const el = document.getElementById('metro-bpm');
  if(el) el.textContent = metroBpm;
  if(metroRunning){
    clearInterval(metroInterval); metroInterval = null; metroRunning = false;
    toggleMetro(metroBpm);
  }
}

function renderBelts(){

      const isCurrent = belt.id === STATE.belt;

          <div style="display:flex;align-items:center;gap:16px;">
            <div style="width:48px;height:48px;border-radius:50%;background:${belt.color};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;color:${belt.textColor};font-size:13px;">${belt.locked?'🔒':pct+'%'}</div>
            <div style="flex:1;">
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
                <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:700;">Cinturón ${belt.name}</div>
                ${isCurrent?'<span style="background:var(--accent);color:#000;font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;">ACTUAL</span>':''}
              </div>
              <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">${belt.locked?'Completa el anterior para desbloquear':`${belt.done} de ${belt.lessons} lecciones`}</div>

function editName(){
  const newName = prompt('¿Cómo te llamas?', STATE.name);
  if(newName && newName.trim()){
    STATE.name = newName.trim();
    save();
    renderProfile();
  }
}

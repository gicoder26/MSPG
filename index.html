<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const KEY='muvit_v3',OLD1='muvit_v2',OLD2='lifts_v1';
const dk=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>dk(new Date());
const iso2d=iso=>{const[y,m,d]=String(iso).split('-').map(Number);return new Date(y,m-1,d)};
const gid=()=> 'x'+Math.random().toString(36).slice(2,10);

const fmtMonth=d=>`${MTHS[d.getMonth()]} ${d.getFullYear()}`;
const monthDays=(d=new Date())=>{const y=d.getFullYear(),m=d.getMonth(),last=new Date(y,m+1,0).getDate(),a=[];for(let i=1;i<=last;i++)a.push(new Date(y,m,i));return a};
const ACTS={gym:{label:'Gym',emoji:'🏋️'},pilates:{label:'Pilates',emoji:'🧘‍♀️'},yoga:{label:'Yoga',emoji:'🧘'},running:{label:'Running',emoji:'🏃'},walk:{label:'Caminata',emoji:'🚶'},other:{label:'Otro',emoji:'✨'}};

const EX_LIBRARY=[
 {name:'Hip thrust',muscle:'Glúteo',target:'8–12 reps'},{name:'Peso muerto rumano',muscle:'Posterior',target:'8–10 reps'},{name:'Sentadilla en Smith',muscle:'Pierna',target:'8–10 reps'},{name:'Sentadilla libre',muscle:'Pierna',target:'6–10 reps'},{name:'Prensa',muscle:'Cuádriceps',target:'10–12 reps'},{name:'Extensión de cuádriceps',muscle:'Cuádriceps',target:'12–15 reps'},{name:'Curl femoral sentado',muscle:'Femoral',target:'10–12 reps'},{name:'Curl femoral echado',muscle:'Femoral',target:'10–12 reps'},{name:'Abductores en máquina',muscle:'Glúteo medio',target:'15–20 reps'},{name:'Patada de glúteo en polea',muscle:'Glúteo',target:'12–15 reps'},{name:'Zancadas caminando',muscle:'Pierna',target:'10–12 reps'},{name:'Bulgarian split squat',muscle:'Pierna',target:'8–10 reps'},

 {name:'Press militar',muscle:'Hombro',target:'8–10 reps'},{name:'Elevaciones laterales',muscle:'Hombro',target:'12–15 reps'},{name:'Face pull',muscle:'Hombro posterior',target:'12–15 reps'},{name:'Curl bíceps',muscle:'Bíceps',target:'10–12 reps'},{name:'Curl martillo',muscle:'Bíceps',target:'10–12 reps'},{name:'Tríceps en polea',muscle:'Tríceps',target:'10–12 reps'},{name:'Fondos asistidos',muscle:'Tríceps',target:'8–12 reps'},

];

 1:{focus:'GLÚTEOS · POSTERIOR',exercises:['Hip thrust','Curl femoral sentado','Peso muerto rumano','Abductores en máquina']},
 2:{focus:'BRAZOS · HOMBRO',exercises:['Tríceps en polea','Pull down','Curl bíceps','Elevaciones laterales']},
 3:{focus:'DESCANSO',exercises:[]},
 4:{focus:'CUÁDRICEPS · GLÚTEO',exercises:['Prensa','Sentadilla en Smith','Extensión de cuádriceps','Patada de glúteo en polea']},

const libEx=name=>{const f=EX_LIBRARY.find(e=>e.name.toLowerCase()===String(name).toLowerCase());return {id:gid(),name:f?.name||name,muscle:f?.muscle||'',target:f?.target||'10–12 reps'}};

function AddExercise({onAdd}){const [open,setOpen]=useState(false),[name,setName]=useState(''),[muscle,setMuscle]=useState(''),[target,setTarget]=useState('10–12 reps');const matches=EX_LIBRARY.filter(e=>e.name.toLowerCase().includes(name.toLowerCase())).slice(0,6);const pick=e=>{setName(e.name);setMuscle(e.muscle);setTarget(e.target)};const add=()=>{if(!name.trim())return;onAdd({name:name.trim(),muscle,target});setName('');setMuscle('');setTarget('10–12 reps');setOpen(false)};return <div className="card" style={{marginTop:10}}>{!open?<button className="btn btn-p" style={{width:'100%'}} onClick={()=>setOpen(true)}><span>Agregar ejercicio</span><span className="round">+</span></button>:<><div className="L" style={{marginBottom:8}}>AGREGAR EJERCICIO</div><div className="suggest"><input className="input" value={name} onChange={e=>setName(e.target.value)} placeholder="Busca: hip thrust, sentadilla, prensa..."/>{name&&matches.length>0&&<div className="sugbox">{matches.map(e=><button key={e.name} onClick={()=>pick(e)}>{e.name} · {e.muscle}</button>)}</div>}</div><div className="grid2" style={{marginTop:9}}><input className="input" value={muscle} onChange={e=>setMuscle(e.target.value)} placeholder="Músculo"/><input className="input" value={target} onChange={e=>setTarget(e.target.value)} placeholder="Objetivo"/></div><div style={{display:'flex',gap:8,marginTop:10}}><button className="small-btn" style={{flex:1}} onClick={()=>setOpen(false)}>Cancelar</button><button className="small-btn dark" style={{flex:2}} onClick={add}>Agregar</button></div></>}</div>}
function ExCard({ex,num,sets,omitted,extra,hist,onUpd,onTog,onOmit,onDelete}){const allDone=sets.filter(s=>s.done).length;return <div className="ex-row" style={{opacity:omitted?.55:1}}><div style={{display:'flex',justifyContent:'space-between',gap:8}}><div style={{flex:1}}><div style={{display:'flex',gap:8,alignItems:'center'}}><div className="D" style={{fontSize:11,color:'var(--dim)',width:18}}>0{num}</div><div className="ex-n">{ex.name.toUpperCase()}</div></div><div className="ex-m">{omitted?'OMITIDO HOY':`${ex.muscle||'Sin músculo'} · ${ex.target||''}`}</div></div><div style={{display:'flex',gap:6,alignItems:'flex-start'}}><button className="small-btn" onClick={onOmit}>{omitted?'hacer':'omitir'}</button>{extra&&<button className="small-btn" onClick={onDelete}>eliminar</button>}</div></div>{!omitted&&<><div className="note">Última vez: {hist.last?`${hist.last.weight} kg · ${hist.last.reps} reps (${hist.last.iso})`:'sin registro previo'}<br/>Mejor marca: {hist.best?`${hist.best.weight} kg · ${hist.best.reps} reps`:'—'}</div><div className="sh"><div/><div className="ch">KG</div><div className="ch">REPS</div><div className="ch">RIR</div><div className="ch">{allDone}/3</div></div>{sets.map((s,i)=><div key={i} className="sr"><div className="sn">{i+1}</div><input className={`inp${s.done?' done':''}`} type="number" inputMode="decimal" value={s.weight||''} placeholder="—" onChange={e=>onUpd(i,'weight',parseFloat(e.target.value)||0)}/><input className={`inp${s.done?' done':''}`} type="number" inputMode="numeric" value={s.reps||''} placeholder="—" onChange={e=>onUpd(i,'reps',parseInt(e.target.value)||0)}/><input className={`inp${s.done?' done':''}`} type="number" inputMode="numeric" value={s.rir??''} placeholder="—" onChange={e=>onUpd(i,'rir',e.target.value===''?null:parseInt(e.target.value))}/><button className={`chk${s.done?' done':''}`} onClick={()=>onTog(i)}>✓</button></div>)}</>}</div>}
function BodyMetricChart({items,field,label,suffix}){const clean=items.filter(x=>x[field]!=null&&x[field]!==''&&!isNaN(Number(x[field]))).slice(-10);if(clean.length<2)return <div className="empty">Agrega más de un dato para ver la evolución de {label.toLowerCase()}.</div>;const vals=clean.map(x=>Number(x[field])),max=Math.max(...vals),min=Math.min(...vals),span=Math.max(1,max-min);return <div><div className="M" style={{fontSize:11,color:'var(--muted)',marginBottom:8}}>{label}: {vals[0]}{suffix} → {vals[vals.length-1]}{suffix}</div><div className="line">{clean.map((b,i)=>{const h=((Number(b[field])-min)/span)*70+8;return <div className="dotcol" key={b.id||i}><div className="dot" style={{marginBottom:`${h}px`}}/></div>})}</div><div className="xaxis">{clean.map((b,i)=><span key={i}>{String(b.date||'').slice(5)}</span>)}</div></div>}
function Stats({st,onAv}){const allDates=Object.keys(st.sessions||{}).sort(),allStats=rangeStats(st,allDates.map(iso2d)),activeDays=allStats.activeDays,totalTrainings=allStats.total,gymDays=allDates.filter(iso=>hasGym(st,iso)).length,weeks=Array.from({length:8},(_,i)=>{const end=new Date();end.setDate(end.getDate()-(7-i)*7);return rangeStats(st,weekDates(dk(end)))}),maxW=Math.max(1,...weeks.map(w=>w.total));const names=allExerciseNames(st),prs=[];let setCount=0;Object.values(st.sessions||{}).forEach(day=>Object.entries(day.gym?.sets||{}).forEach(([id,arr])=>(arr||[]).forEach(s=>{if(s?.done){setCount++;if(s.weight)prs.push({name:names[id]||'Ejercicio',kg:Number(s.weight),reps:s.reps||0})}})));prs.sort((a,b)=>b.kg-a.kg);const unique=[];prs.forEach(p=>{if(!unique.some(u=>u.name===p.name))unique.push(p)});const body=st.user.bodyLog||[],avgWeek=weeks.length?(weeks.reduce((n,w)=>n+w.total,0)/weeks.length).toFixed(1):'0';return <div className="body fade"><TB user={st.user} sub="Análisis de progreso" onAv={onAv}/><div className="grid2"><div className="kpi"><div className="L">Entrenamientos</div><div className="num">{totalTrainings}</div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:5}}>Desde que iniciaste</div></div><div className="kpi"><div className="L">Días activos</div><div className="num">{activeDays}</div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:5}}>{avgWeek} prom./semana</div></div></div><div className="grid2" style={{marginTop:10}}><div className="kpi"><div className="L">Sesiones gym</div><div className="num">{gymDays}</div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:5}}>Con ejercicios registrados</div></div><div className="kpi"><div className="L">Series hechas</div><div className="num">{setCount}</div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:5}}>Total acumulado</div></div></div><Section>Entrenamientos por semana</Section><div className="chart"><div className="bars">{weeks.map((w,i)=><div key={i} className="bar" style={{height:`${Math.max(4,w.total/maxW*100)}%`}}><span>{w.total}</span></div>)}</div><div className="xaxis">{weeks.map((_,i)=><span key={i}>S{i+1}</span>)}</div></div><Section>Distribución acumulada</Section><div className="chart">{ACT_ORDER.map(t=>{const max=Math.max(1,...ACT_ORDER.map(k=>allStats.counts[k]||0));return <div className="hbar" key={t}><label>{ACTS[t].emoji} {ACTS[t].label}</label><div className="track"><div className="fill" style={{width:`${(allStats.counts[t]||0)/max*100}%`}}/></div><b>{allStats.counts[t]||0}</b></div>})}</div><Section>Récords de fuerza</Section><div>{unique.length===0?<div className="empty card">Completa series para ver récords y comparativas.</div>:unique.slice(0,7).map((p,i)=><div key={i} className="card" style={{marginBottom:8,display:'flex',justifyContent:'space-between',alignItems:'center'}}><div><div className="D" style={{fontSize:15}}>{p.name.toUpperCase()}</div><div className="M" style={{fontSize:9,color:'var(--muted)',marginTop:4}}>{p.reps} reps</div></div><div className="D" style={{fontSize:28}}>{p.kg}<span style={{fontSize:11,color:'var(--muted)'}}>kg</span></div></div>)}</div><Section>Evolución corporal</Section><div className="chart"><BodyMetricChart items={body} field="weightKg" label="Peso" suffix="kg"/></div><div className="chart" style={{marginTop:10}}><BodyMetricChart items={body} field="bodyFatPct" label="Grasa corporal" suffix="%"/></div></div>}
function ProfileModal({st,setSt,onClose}){const [name,setName]=useState(st.user.name||''),[goal,setGoal]=useState(st.user.goal||'Bajar grasa'),[wt,setWt]=useState(st.user.weightKg||''),[bf,setBf]=useState(st.user.bodyFatPct||''),[mg,setMg]=useState(st.user.monthlyGoalGym||12),[mm,setMm]=useState(st.user.monthlyGoalMove||20),[edit,setEdit]=useState(false);const save=()=>{setSt(s=>{const stages=goal!==s.user.goal?[...(s.user.stages||[]),{id:gid(),goal,start:todayISO()}]:(s.user.stages||[]);const bodyLog=[...(s.user.bodyLog||[])];const nw=parseFloat(wt)||null,nb=parseFloat(bf)||null;if(nw!==s.user.weightKg||nb!==s.user.bodyFatPct)bodyLog.push({id:gid(),date:todayISO(),weightKg:nw,bodyFatPct:nb});return {...s,user:{...s.user,name:name.trim()||s.user.name,goal,weightKg:nw,bodyFatPct:nb,monthlyGoalGym:parseInt(mm)||20,monthlyGoalMove:parseInt(mm)||20,stages,bodyLog}}});onClose()};if(edit)return <RoutineEditor st={st} setSt={setSt} onBack={()=>setEdit(false)}/>;return <div className="modal-bg" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}><div className="D" style={{fontSize:24}}>PERFIL</div><button className="small-btn" onClick={onClose}>cerrar</button></div><label className="field"><span>Nombre</span><input value={name} onChange={e=>setName(e.target.value)}/></label><label className="field"><span>Objetivo</span><select value={goal} onChange={e=>setGoal(e.target.value)}><option>Bajar grasa</option><option>Ganar músculo</option><option>Ganar fuerza</option><option>Recomposición</option><option>Mantener</option></select></label><div className="grid2"><label className="field"><span>Peso kg</span><input type="number" value={wt} onChange={e=>setWt(e.target.value)} placeholder="Opcional"/></label><label className="field"><span>% grasa</span><input type="number" value={bf} onChange={e=>setBf(e.target.value)} placeholder="Opcional"/></label></div><label className="field"><span>Meta mensual de entrenamiento</span><input type="number" value={mm} onChange={e=>{setMm(e.target.value);setMg(e.target.value)}}/></label><p className="M" style={{fontSize:10,color:'var(--muted)',marginTop:-6,marginBottom:10}}>Esta meta cuenta todo lo que registres: gym y otras disciplinas.</p><button className="btn btn-s" style={{width:'100%',marginTop:8}} onClick={()=>setEdit(true)}><span>Editar rutina semanal</span><span>→</span></button><button className="btn btn-p" style={{width:'100%',marginTop:10}} onClick={save}><span>Guardar perfil</span><span className="round">✓</span></button><div style={{borderTop:'1px solid var(--line)',marginTop:18,paddingTop:14}}><div className="L" style={{marginBottom:8,color:'var(--dim)'}}>AJUSTES AVANZADOS</div><button className="small-btn" style={{width:'100%',borderColor:'var(--acc2)',color:'var(--acc2)',borderRadius:14,padding:12}} onClick={resetApp}>Borrar datos y reiniciar</button><div className="M" style={{fontSize:9,color:'var(--dim)',textAlign:'center',marginTop:6}}>Reinicia MUVIT solo en este dispositivo.</div></div></div></div>}
function RoutineEditor({st,setSt,onBack}){const [rtn,setRtn]=useState(JSON.parse(JSON.stringify(normalizeRoutine(st.routine)))),[dow,setDow]=useState(1);const day=rtn[dow];const updateEx=(id,field,val)=>setRtn(r=>({...r,[dow]:{...r[dow],exercises:r[dow].exercises.map(e=>e.id===id?{...e,[field]:val}:e)}}));const add=ex=>setRtn(r=>({...r,[dow]:{...r[dow],focus:r[dow].focus==='DESCANSO'?'ENTRENAMIENTO':r[dow].focus,exercises:[...r[dow].exercises,{...ex,id:gid()}]}}));const del=id=>setRtn(r=>({...r,[dow]:{...r[dow],exercises:r[dow].exercises.filter(e=>e.id!==id)}}));const save=()=>{setSt(s=>({...s,routine:normalizeRoutine(rtn)}));onBack()};return <div className="modal-bg"><div className="modal"><button className="small-btn" onClick={onBack}>← perfil</button><div className="D" style={{fontSize:25,margin:'14px 0'}}>EDITAR RUTINA</div><div className="dtog-wrap">{[1,2,3,4,5,6,0].map(d=><button key={d} className={`dtog${dow===d?' on':''}`} onClick={()=>setDow(d)}>{DOWS[d]}</button>)}</div><label className="field"><span>Foco del día</span><input value={day.focus} onChange={e=>setRtn(r=>({...r,[dow]:{...r[dow],focus:e.target.value}}))}/></label>{day.exercises.map(ex=><div className="card" key={ex.id} style={{marginBottom:8}}><div className="suggest"><input className="input" value={ex.name} onChange={e=>updateEx(ex.id,'name',e.target.value)} placeholder="Ejercicio"/></div><div className="grid2" style={{marginTop:8}}><input className="input" value={ex.muscle} onChange={e=>updateEx(ex.id,'muscle',e.target.value)} placeholder="Músculo"/><input className="input" value={ex.target} onChange={e=>updateEx(ex.id,'target',e.target.value)} placeholder="Objetivo"/></div><button className="small-btn" style={{marginTop:8}} onClick={()=>del(ex.id)}>Eliminar</button></div>)}<AddExercise onAdd={add}/><button className="btn btn-p" style={{width:'100%',marginTop:12}} onClick={save}><span>Guardar rutina</span><span className="round">✓</span></button></div></div>}
function App(){const [st,setSt]=useState(()=>load()),[tab,setTab]=useState('home'),[prof,setProf]=useState(false),[activeDate,setActiveDate]=useState(todayISO());useEffect(()=>persist(st),[st]);if(!st.onboarded)return <Onboarding onDone={setSt}/>;const openGym=iso=>{setActiveDate(iso);markActivity(setSt,iso,'gym');setTab('workout')};let body=tab==='home'?<Home st={st} setSt={setSt} onAv={()=>setProf(true)} onStartGym={openGym}/>:tab==='calendar'?<Calendar st={st} setSt={setSt} onAv={()=>setProf(true)} onGym={openGym}/>:tab==='workout'?<Workout st={st} setSt={setSt} onAv={()=>setProf(true)} activeDate={activeDate} setActiveDate={setActiveDate}/>:<Stats st={st} onAv={()=>setProf(true)}/>;return <><div className="app"><div className="scroll">{body}</div><Nav active={tab} onChange={setTab}/></div>{prof&&<ProfileModal st={st} setSt={setSt} onClose={()=>setProf(false)}/>}</>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
